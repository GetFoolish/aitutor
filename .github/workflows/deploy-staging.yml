name: Deploy to Google Cloud Run (Staging)

on:
  push:
    branches:
      - staging

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: aitutor-473420

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Fetch validation secrets
        run: |
          echo "MONGODB_URI=$(gcloud secrets versions access latest --secret=MONGODB_URI)" >> $GITHUB_ENV
          echo "MONGODB_DB_NAME=ai_tutor" >> $GITHUB_ENV

      - name: Run backend tests
        run: python3 -m pytest

      - name: Run security contract checks
        run: python3 scripts/check_security_contract.py

      - name: Verify seeded Mongo data
        run: python3 scripts/verify_seed_data.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend type-check
        working-directory: frontend
        run: npm run type-check

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Run frontend smoke tests
        working-directory: frontend
        run: npm run test:ci

  deploy:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: aitutor-473420

      - name: Set deploy environment
        run: |
          echo "MONGODB_DB_NAME=ai_tutor" >> $GITHUB_ENV
          echo "MONGODB_URI_SECRET=MONGODB_URI:latest" >> $GITHUB_ENV
          echo "OPENROUTER_API_KEY_SECRET=OPENROUTER_API_KEY:latest" >> $GITHUB_ENV
          echo "GEMINI_API_KEY_SECRET=GEMINI_API_KEY:latest" >> $GITHUB_ENV
          echo "JWT_SECRET_SECRET=JWT_SECRET:latest" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID_SECRET=GOOGLE_CLIENT_ID:latest" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_SECRET_SECRET=GOOGLE_CLIENT_SECRET:latest" >> $GITHUB_ENV
          echo "OBSERVER_API_KEY_SECRET=OBSERVER_API_KEY:latest" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID_PUBLIC=$(gcloud secrets versions access latest --secret=GOOGLE_CLIENT_ID)" >> $GITHUB_ENV
          echo "ALLOWED_ORIGINS=https://staging.teachr.live" >> $GITHUB_ENV
          echo "FRONTEND_URL=https://staging.teachr.live" >> $GITHUB_ENV

      - name: Grant execute permissions
        run: chmod +x ./deploy.sh

      - name: Deploy to staging
        run: ./deploy.sh staging
