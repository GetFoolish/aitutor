name: Deploy to Google Cloud Run (Production)

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: aitutor-473420

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Fetch validation secrets
        run: |
          echo "MONGODB_URI=$(gcloud secrets versions access latest --secret=MONGODB_URI)" >> $GITHUB_ENV
          echo "MONGODB_DB_NAME=ai_tutor" >> $GITHUB_ENV

      - name: Run backend tests
        run: python3 -m pytest --ignore=tests/test_integration.py

      - name: Run security contract checks
        run: python3 scripts/check_security_contract.py

      - name: Detect first-time backend bootstrap
        run: |
          set -euo pipefail

          describe_url() {
            gcloud run services describe "$1" \
              --region us-central1 \
              --project aitutor-473420 \
              --format='value(status.url)' 2>/dev/null || true
          }

          DASH_API_URL="$(describe_url dash-api)"
          SHERLOCKED_API_URL="$(describe_url sherlocked-api)"
          TEACHING_ASSISTANT_API_URL="$(describe_url teaching-assistant)"
          AUTH_SERVICE_URL="$(describe_url auth-service)"

          if [[ -n "$DASH_API_URL" && -n "$SHERLOCKED_API_URL" && -n "$TEACHING_ASSISTANT_API_URL" && -n "$AUTH_SERVICE_URL" ]]; then
            echo "BOOTSTRAP_REQUIRED=false" >> "$GITHUB_ENV"
          else
            echo "BOOTSTRAP_REQUIRED=true" >> "$GITHUB_ENV"
          fi

      - name: Verify seeded Mongo data
        if: env.BOOTSTRAP_REQUIRED != 'true' && env.MONGODB_URI != ''
        run: python3 scripts/verify_seed_data.py

      - name: Skip seed verification (MONGODB_URI unavailable from Secret Manager)
        if: env.BOOTSTRAP_REQUIRED != 'true' && env.MONGODB_URI == ''
        run: |
          echo "::warning::MONGODB_URI secret could not be read from Secret Manager (check GHA SA permissions)."
          echo "Skipping pre-deploy seed verification. Verify seeded data manually after deploy."

      - name: Defer seed verification until post-bootstrap deploy
        if: env.BOOTSTRAP_REQUIRED == 'true'
        run: echo "Skipping pre-deploy seed verification because backend bootstrap is required."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend type-check
        working-directory: frontend
        run: npm run type-check

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Run frontend smoke tests
        working-directory: frontend
        run: npm run test:ci

  deploy:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: aitutor-473420

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Set deploy environment
        run: |
          echo "MONGODB_DB_NAME=ai_tutor" >> $GITHUB_ENV
          echo "MONGODB_URI_SECRET=MONGODB_URI:latest" >> $GITHUB_ENV
          echo "OPENROUTER_API_KEY_SECRET=OPENROUTER_API_KEY:latest" >> $GITHUB_ENV
          echo "GEMINI_API_KEY_SECRET=GEMINI_API_KEY:latest" >> $GITHUB_ENV
          echo "JWT_SECRET_SECRET=JWT_SECRET:latest" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID_SECRET=GOOGLE_CLIENT_ID:latest" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_SECRET_SECRET=GOOGLE_CLIENT_SECRET:latest" >> $GITHUB_ENV
          echo "OBSERVER_API_KEY_SECRET=OBSERVER_API_KEY:latest" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID_PUBLIC=${{ vars.GOOGLE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ALLOWED_ORIGINS=https://teachr.live" >> $GITHUB_ENV
          echo "FRONTEND_URL=https://teachr.live" >> $GITHUB_ENV

      - name: Grant execute permissions
        run: chmod +x ./deploy.sh

      - name: Deploy to production
        run: ./deploy.sh prod
