[mypy]
# Mypy configuration for AI Tutor project
python_version = 3.14
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = False

# Relax strict optional checking (reduces 130+ None-safety violations)
no_implicit_optional = False
strict_optional = False

# Allow missing imports for third-party libraries without stubs
ignore_missing_imports = True

# Per-module options for critical modules
[mypy-services.DashSystem.dash_system]
# dash_system is the most critical - enable stricter checks here
warn_return_any = True

[mypy-services.DashSystem.dash_api]
# Main API - enable stricter checks
warn_return_any = True

[mypy-tests.*]
# Relax checks for tests
ignore_errors = True

[mypy-services.*.test_*]
# Relax checks for test files
ignore_errors = True
