<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
    <style>
        .grid-line { stroke: #e5e7eb; stroke-width: 1; fill: none; }
        .outline { stroke: #000; stroke-width: 3; fill: none; }
        .label { font-family: "Times New Roman", Times, serif; font-size: 20px; font-weight: normal; text-anchor: middle; dominant-baseline: middle; fill: black; }
        .athena-theme-dark .label { fill: white; }
        .athena-theme-dark .outline { stroke: white; }
        .athena-theme-dark .grid-line { stroke: #374151; }
    </style>
    
    <!-- Grid: 5 columns x 5 rows (160x160) -->
    <path class="grid-line" d="M0 0 H160" />
    <path class="grid-line" d="M0 32 H160" />
    <path class="grid-line" d="M0 64 H160" />
    <path class="grid-line" d="M0 96 H160" />
    <path class="grid-line" d="M0 128 H160" />
    <path class="grid-line" d="M0 160 H160" />
    
    <path class="grid-line" d="M0 0 V160" />
    <path class="grid-line" d="M32 0 V160" />
    <path class="grid-line" d="M64 0 V160" />
    <path class="grid-line" d="M96 0 V160" />
    <path class="grid-line" d="M128 0 V160" />
    <path class="grid-line" d="M160 0 V160" />

    <!-- Shape Outline (L-shape) -->
    <!-- Top Bar: Cols 1-3, Rows 2-3 -->
    <!-- Bottom Leg: Col 1, Row 4 -->
    <path class="outline" d="M0 32 H96 V96 H32 V128 H0 Z" />

    <!-- Numbers -->
    <!-- Row 2 -->
    <text class="label" x="16" y="48">1</text>
    <text class="label" x="48" y="48">2</text>
    <text class="label" x="80" y="48">3</text>
    
    <!-- Row 3 -->
    <text class="label" x="16" y="80">4</text>
    <text class="label" x="48" y="80">5</text>
    <text class="label" x="80" y="80">6</text>
    
    <!-- Row 4 -->
    <text class="label" x="16" y="112">7</text>
</svg>
