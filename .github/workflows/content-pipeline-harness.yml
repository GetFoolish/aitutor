name: Content Pipeline Harness

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Make harness scripts executable
        run: |
          chmod +x scripts/harness/*.sh
          chmod +x scripts/harness/*.py

      - name: Start local stack for harness
        run: |
          nohup python3 services/AuthService/auth_api.py > /tmp/auth_api.log 2>&1 &
          nohup python3 services/DashSystem/dash_api.py > /tmp/dash_api.log 2>&1 &
          nohup python3 services/TeachingAssistant/api.py > /tmp/ta_api.log 2>&1 &
          nohup npm --prefix frontend run dev -- --host 0.0.0.0 --port 3000 > /tmp/frontend.log 2>&1 &

      - name: Wait for local services
        run: |
          set -e
          for url in \
            http://localhost:8003/health \
            http://localhost:8000/health \
            http://localhost:8002/health \
            http://localhost:3000/app/dev-login
          do
            echo "Waiting for $url"
            for i in $(seq 1 90); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                echo "Ready: $url"
                break
              fi
              sleep 2
              if [ "$i" = "90" ]; then
                echo "Timeout waiting for $url"
                exit 1
              fi
            done
          done

      - name: Run harness
        id: harness
        continue-on-error: true
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
          GREPTILE_REVIEW_COMMAND: ${{ vars.GREPTILE_REVIEW_COMMAND }}
          HARNESS_REQUIRE_GREPTILE: ${{ vars.HARNESS_REQUIRE_GREPTILE || '0' }}
        run: |
          OUT_DIR="artifacts/harness/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          export PLAYWRIGHT_BASE_URL="http://localhost:3000"
          python3 scripts/harness/run_pipeline_harness.py --mode ci --output-dir "$OUT_DIR"

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-pipeline-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.harness.outputs.out_dir }}
          if-no-files-found: warn

      - name: Post PR harness comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outDir = `${{ toJSON(steps.harness.outputs.out_dir) }}`.replace(/^"|"$/g, '');
            const bodyPath = `${outDir}/PR_PACKET.md`;
            let body = `Harness artifacts: ${outDir}`;
            if (fs.existsSync(bodyPath)) {
              const content = fs.readFileSync(bodyPath, 'utf8');
              body = [
                '## Content Pipeline Harness Result',
                '',
                `Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                content.slice(0, 60000)
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce harness pass
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          out_dir = Path("${{ steps.harness.outputs.out_dir }}")
          summary = out_dir / "summary.json"
          if not summary.exists():
              raise SystemExit("summary.json missing")

          data = json.loads(summary.read_text(encoding="utf-8"))
          if not data.get("ok"):
              raise SystemExit("Harness failed")
          print("Harness passed")
          PY
