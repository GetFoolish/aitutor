version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: ai_tutor_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  dash-api:
    build:
      context: .
      dockerfile: services/DashSystem/Dockerfile
    ports:
      - "8000:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 8080
      ENVIRONMENT: development
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongodb:27017/ai_tutor}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-ai_tutor}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

  sherlocked-api:
    build:
      context: .
      dockerfile: services/SherlockEDApi/Dockerfile
    ports:
      - "8001:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 8080
      ENVIRONMENT: development
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongodb:27017/ai_tutor}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-ai_tutor}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

  teaching-assistant:
    build:
      context: .
      dockerfile: services/TeachingAssistant/Dockerfile
    ports:
      - "8002:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      dash-api:
        condition: service_started
    environment:
      PORT: 8080
      ENVIRONMENT: development
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongodb:27017/ai_tutor}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-ai_tutor}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      OBSERVER_API_KEY: ${OBSERVER_API_KEY}
      DASH_API_URL: ${DOCKER_DASH_API_URL:-http://dash-api:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

  auth-service:
    build:
      context: .
      dockerfile: services/AuthService/Dockerfile
    ports:
      - "8003:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 8080
      ENVIRONMENT: development
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongodb:27017/ai_tutor}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-ai_tutor}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-models/gemini-2.5-flash-native-audio-preview-09-2025}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://localhost:8003}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_DASH_API_URL: ${DASH_API_URL:-http://localhost:8000}
        VITE_SHERLOCKED_API_URL: ${SHERLOCKED_API_URL:-http://localhost:8001}
        VITE_TEACHING_ASSISTANT_API_URL: ${TEACHING_ASSISTANT_API_URL:-http://localhost:8002}
        VITE_AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://localhost:8003}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:8080"
    depends_on:
      dash-api:
        condition: service_started
      sherlocked-api:
        condition: service_started
      teaching-assistant:
        condition: service_started
      auth-service:
        condition: service_started

volumes:
  mongodb_data:
