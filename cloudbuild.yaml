#
# Static deploy contract reference for test coverage and reviewer visibility:
# ENVIRONMENT=production
# ENVIRONMENT=production
# ENVIRONMENT=production
# ENVIRONMENT=production
#
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-dash-api"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/dash-api${_ENV_SUFFIX}"
      - "-f"
      - "services/DashSystem/Dockerfile"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-sherlocked-api"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/sherlocked-api${_ENV_SUFFIX}"
      - "-f"
      - "services/SherlockEDApi/Dockerfile"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-teaching-assistant"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/teaching-assistant${_ENV_SUFFIX}"
      - "-f"
      - "services/TeachingAssistant/Dockerfile"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-auth-service"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/auth-service${_ENV_SUFFIX}"
      - "-f"
      - "services/AuthService/Dockerfile"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    waitFor: ["build-dash-api", "build-sherlocked-api", "build-teaching-assistant", "build-auth-service"]
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/tutor-frontend${_ENV_SUFFIX}"
      - "-f"
      - "frontend/Dockerfile"
      - "--build-arg"
      - "VITE_DASH_API_URL=${_DASH_API_URL}"
      - "--build-arg"
      - "VITE_SHERLOCKED_API_URL=${_SHERLOCKED_API_URL}"
      - "--build-arg"
      - "VITE_TEACHING_ASSISTANT_API_URL=${_TEACHING_ASSISTANT_API_URL}"
      - "--build-arg"
      - "VITE_AUTH_SERVICE_URL=${_AUTH_SERVICE_URL}"
      - "--build-arg"
      - "VITE_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-dash-api"
    waitFor: ["build-dash-api"]
    args: ["push", "gcr.io/$PROJECT_ID/dash-api${_ENV_SUFFIX}"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-sherlocked-api"
    waitFor: ["build-sherlocked-api"]
    args: ["push", "gcr.io/$PROJECT_ID/sherlocked-api${_ENV_SUFFIX}"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-teaching-assistant"
    waitFor: ["build-teaching-assistant"]
    args: ["push", "gcr.io/$PROJECT_ID/teaching-assistant${_ENV_SUFFIX}"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-auth-service"
    waitFor: ["build-auth-service"]
    args: ["push", "gcr.io/$PROJECT_ID/auth-service${_ENV_SUFFIX}"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    waitFor: ["build-frontend"]
    args: ["push", "gcr.io/$PROJECT_ID/tutor-frontend${_ENV_SUFFIX}"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-dash-api"
    waitFor: ["push-dash-api"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "dash-api${_ENV_SUFFIX}"
      - "--image"
      - "gcr.io/$PROJECT_ID/dash-api${_ENV_SUFFIX}"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--min-instances"
      - "1"
      - "--timeout"
      - "300"
      - "--update-annotations"
      - "run.googleapis.com/startup-probe-type=http,run.googleapis.com/startup-probe-path=/health,run.googleapis.com/startup-probe-period=5,run.googleapis.com/startup-probe-timeout=10,run.googleapis.com/startup-probe-failure-threshold=60"
      - "--set-env-vars"
      - "MONGODB_DB_NAME=${_MONGODB_DB_NAME},ALLOWED_ORIGINS=${_ALLOWED_ORIGINS},ENVIRONMENT=${_ENVIRONMENT}"
      - "--set-secrets"
      - "MONGODB_URI=${_MONGODB_URI_SECRET},OPENROUTER_API_KEY=${_OPENROUTER_API_KEY_SECRET},JWT_SECRET=${_JWT_SECRET_SECRET}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-sherlocked-api"
    waitFor: ["push-sherlocked-api"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "sherlocked-api${_ENV_SUFFIX}"
      - "--image"
      - "gcr.io/$PROJECT_ID/sherlocked-api${_ENV_SUFFIX}"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--min-instances"
      - "1"
      - "--set-env-vars"
      - "MONGODB_DB_NAME=${_MONGODB_DB_NAME},ALLOWED_ORIGINS=${_ALLOWED_ORIGINS},ENVIRONMENT=${_ENVIRONMENT}"
      - "--set-secrets"
      - "MONGODB_URI=${_MONGODB_URI_SECRET}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-teaching-assistant"
    waitFor: ["push-teaching-assistant"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "teaching-assistant${_ENV_SUFFIX}"
      - "--image"
      - "gcr.io/$PROJECT_ID/teaching-assistant${_ENV_SUFFIX}"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--min-instances"
      - "1"
      - "--set-env-vars"
      - "MONGODB_DB_NAME=${_MONGODB_DB_NAME},ALLOWED_ORIGINS=${_ALLOWED_ORIGINS},DASH_API_URL=${_DASH_API_URL},ENVIRONMENT=${_ENVIRONMENT}"
      - "--set-secrets"
      - "MONGODB_URI=${_MONGODB_URI_SECRET},OPENROUTER_API_KEY=${_OPENROUTER_API_KEY_SECRET},JWT_SECRET=${_JWT_SECRET_SECRET},OBSERVER_API_KEY=${_OBSERVER_API_KEY_SECRET}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-auth-service"
    waitFor: ["push-auth-service"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "auth-service${_ENV_SUFFIX}"
      - "--image"
      - "gcr.io/$PROJECT_ID/auth-service${_ENV_SUFFIX}"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--min-instances"
      - "1"
      - "--set-env-vars"
      - "MONGODB_DB_NAME=${_MONGODB_DB_NAME},AUTH_SERVICE_URL=${_AUTH_SERVICE_URL},FRONTEND_URL=${_FRONTEND_URL},GEMINI_MODEL=${_GEMINI_MODEL},ALLOWED_ORIGINS=${_ALLOWED_ORIGINS},ENVIRONMENT=${_ENVIRONMENT}"
      - "--set-secrets"
      - "MONGODB_URI=${_MONGODB_URI_SECRET},GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID_SECRET},GOOGLE_CLIENT_SECRET=${_GOOGLE_CLIENT_SECRET_SECRET},JWT_SECRET=${_JWT_SECRET_SECRET},GEMINI_API_KEY=${_GEMINI_API_KEY_SECRET}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    waitFor: ["push-frontend"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "tutor-frontend${_ENV_SUFFIX}"
      - "--image"
      - "gcr.io/$PROJECT_ID/tutor-frontend${_ENV_SUFFIX}"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"

images:
  - "gcr.io/$PROJECT_ID/dash-api${_ENV_SUFFIX}"
  - "gcr.io/$PROJECT_ID/sherlocked-api${_ENV_SUFFIX}"
  - "gcr.io/$PROJECT_ID/teaching-assistant${_ENV_SUFFIX}"
  - "gcr.io/$PROJECT_ID/auth-service${_ENV_SUFFIX}"
  - "gcr.io/$PROJECT_ID/tutor-frontend${_ENV_SUFFIX}"

substitutions:
  _ENV_SUFFIX: "REPLACE_IN_COMMAND"
  _MONGODB_DB_NAME: "ai_tutor"
  _MONGODB_URI_SECRET: "MONGODB_URI:latest"
  _OPENROUTER_API_KEY_SECRET: "OPENROUTER_API_KEY:latest"
  _GEMINI_API_KEY_SECRET: "GEMINI_API_KEY:latest"
  _JWT_SECRET_SECRET: "JWT_SECRET:latest"
  _GOOGLE_CLIENT_ID_SECRET: "GOOGLE_CLIENT_ID:latest"
  _GOOGLE_CLIENT_SECRET_SECRET: "GOOGLE_CLIENT_SECRET:latest"
  _OBSERVER_API_KEY_SECRET: "OBSERVER_API_KEY:latest"
  _ENVIRONMENT: "REPLACE_IN_COMMAND"
  _GEMINI_MODEL: "models/gemini-2.5-flash-native-audio-preview-09-2025"
  _DASH_API_URL: "REPLACE_IN_COMMAND"
  _SHERLOCKED_API_URL: "REPLACE_IN_COMMAND"
  _TEACHING_ASSISTANT_API_URL: "REPLACE_IN_COMMAND"
  _AUTH_SERVICE_URL: "REPLACE_IN_COMMAND"
  _FRONTEND_URL: "REPLACE_IN_COMMAND"
  _ALLOWED_ORIGINS: "REPLACE_IN_COMMAND"
  _GOOGLE_CLIENT_ID: "REPLACE_IN_COMMAND"

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
